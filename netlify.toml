[build]
  command = "npm run build"
  publish = "dist/apps/waveform"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Local certificates for `netlify dev` over HTTPS, generated by `npm run certs` (mkcert).
[dev.https]
  certFile = ".certs/cert.pem"
  keyFile = ".certs/key.pem"

# the assets of the promo pages (apps/site): their names are hashes of their contents
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
