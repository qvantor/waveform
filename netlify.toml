[build]
  command = "npm run build"
  publish = "dist/apps/chisper"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` serves only the functions: `npm start` runs the Nx dev server itself (a framework detected here,
# Astro of apps/site, would start a server of its own and wait for its port)
[dev]
  framework = "#static"

# Local certificates for `netlify dev` over HTTPS, generated by `npm run certs` (mkcert).
[dev.https]
  certFile = ".certs/cert.pem"
  keyFile = ".certs/key.pem"

# the assets of the promo pages (apps/site): their names are hashes of their contents
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# the old domain of the synth (a domain alias of the site) before its rename to Chisper: every link, a preset's
# (?preset=, the query goes along) and the promo pages too, opens on the new one
[[redirects]]
  from = "https://waveform.qvantor.org/*"
  to = "https://chisper.qvantor.org/:splat"
  status = 301
  force = true

# the files of the buckets through the site, where their domains don't load (Cloudflare throttled or blocked on
# the way: the browser talks only to Netlify, which fetches them): the fallback of `bucketLoader` of the app
[[redirects]]
  from = "/files/wavetables/*"
  to = "https://wavetables.chisper.qvantor.org/:splat"
  status = 200

[[redirects]]
  from = "/files/noises/*"
  to = "https://noises.chisper.qvantor.org/:splat"
  status = 200
