name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
      # the Rust cores of the worklets (dsp/): the toolchain and the target of dsp/rust-toolchain.toml
      - id: rust
        name: Rust toolchain
        working-directory: dsp
        run: rustup toolchain install && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('dsp/rust-toolchain.toml', 'dsp/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cargo fmt
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: dsp
        run: cargo fmt --check
      - name: Cargo clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: dsp
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: dsp
        run: cargo test --quiet
      - id: wasm
        name: Wasm cores
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: npm run wasm
      - name: Constants of the cores
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: node dsp/gen/consts.mjs --check
      - name: Size of the cores
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: node scripts/wasm.mjs --check-sizes
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run prettier:check
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run knip
      - name: Test
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: npx nx run-many --target=test --all
      - name: Script tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:scripts
